# Redis Configuration with Persistence
# RDB Persistence
save 900 1
save 300 10
save 60 10000

# AOF Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory settings
maxmemory 256mb
maxmemory-policy allkeys-lru

# Network settings
bind 0.0.0.0
port 6379

# Security
# requirepass your_password_here

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
timeout 0

# Data persistence directory
dir /data

# Enable keyspace notifications
notify-keyspace-events "Ex" 